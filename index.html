<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>EMOF International</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:28px 20px 22px;border-radius:0 0 24px 24px}h1{margin:0;font-size:28px}header p{margin:5px 0 0;color:#d1d5db}
main{padding:18px;max-width:700px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:white;border:0;border-radius:18px;padding:22px;box-shadow:0 2px 12px #00000012;text-align:left;font-size:17px}
.card b{display:block;font-size:19px;margin-bottom:7px}.icon{font-size:30px;margin-bottom:10px}
.panel{display:none;background:white;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 2px 12px #00000012}
.panel.active{display:block}label{display:block;font-weight:600;margin:14px 0 6px}input,select,button{width:100%;padding:14px;border-radius:12px;border:1px solid #d1d5db;font-size:16px;background:white}
button.primary{background:#111827;color:white;border:0;margin-top:16px;font-weight:700}.back{background:#e5e7eb;border:0;margin-bottom:8px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.levels button{font-weight:700}.levels button.selected{background:#111827;color:white}
.item{padding:12px;border-bottom:1px solid #e5e7eb}.small{color:#6b7280;font-size:14px}
#toast{position:fixed;bottom:20px;left:20px;right:20px;background:#111827;color:#fff;padding:14px;border-radius:12px;display:none;text-align:center}
</style>
</head>
<body>
<header><h1>EMOF International</h1><p>Clothing Collection Management</p></header>
<main>
<div class="grid">
<button class="card" onclick="show('shops')"><div class="icon">🏪</div><b>Shop Collections</b><span>Record collections and weights</span></button>
<button class="card" onclick="show('banks')"><div class="icon">👕</div><b>Clothing Banks</b><span>Check in and record fill level</span></button>
<button class="card" onclick="show('history')"><div class="icon">📊</div><b>Reports</b><span>View saved collection records</span></button>
<button class="card" onclick="show('about')"><div class="icon">🚚</div><b>Driver</b><span>Collection management</span></button>
</div>

<section id="shops" class="panel">
<button class="back" onclick="home()">← Home</button><h2>Shop Collection</h2>
<label>Shop name</label><input id="shop" placeholder="Enter shop name">
<label>Driver</label><input id="driver" placeholder="Driver name">
<label>Weight (kg)</label><input id="weight" type="number" min="0" step="0.1" placeholder="0">
<button class="primary" onclick="saveShop()">Save collection</button>
</section>

<section id="banks" class="panel">
<button class="back" onclick="home()">← Home</button><h2>Clothing Bank</h2>
<label>Bank ID / QR code</label><input id="bank" placeholder="Scan or enter bank ID">
<p class="small">Fill level — 1 is empty, 4 is full</p>
<div class="levels">
<button onclick="level(1)">1</button><button onclick="level(2)">2</button><button onclick="level(3)">3</button><button onclick="level(4)">4</button>
</div>
<input type="hidden" id="fill">
<label>Driver</label><input id="bankDriver" placeholder="Driver name">
<button class="primary" onclick="saveBank()">Save bank visit</button>
</section>

<section id="history" class="panel">
<button class="back" onclick="home()">← Home</button><h2>Reports</h2><div id="records"></div>
<button class="primary" onclick="clearRecords()">Clear saved records</button>
</section>

<section id="about" class="panel">
<button class="back" onclick="home()">← Home</button><h2>EMOF International</h2>
<p>This free app records shop clothing collections and clothing-bank visits. No GPS is required.</p>
</section>
</main><div id="toast"></div>
<script>
let records=JSON.parse(localStorage.getItem('emof_records')||'[]');
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='history')render()}
function home(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'))}
function level(n){document.getElementById('fill').value=n;document.querySelectorAll('.levels button').forEach((b,i)=>b.classList.toggle('selected',i===n-1))}
function saveShop(){let r={type:'Shop',shop:shop.value,driver:driver.value,weight:weight.value,date:new Date().toLocaleString()};if(!r.shop||!r.weight)return alert('Please enter shop name and weight');records.unshift(r);localStorage.setItem('emof_records',JSON.stringify(records));toast('Shop collection saved');shop.value=driver.value=weight.value=''}
function saveBank(){let r={type:'Bank',bank:bank.value,fill:fill.value,driver:bankDriver.value,date:new Date().toLocaleString()};if(!r.bank||!r.fill)return alert('Please enter bank ID and fill level');records.unshift(r);localStorage.setItem('emof_records',JSON.stringify(records));toast('Bank visit saved');bank.value=bankDriver.value='';fill.value='';document.querySelectorAll('.levels button').forEach(b=>b.classList.remove('selected'))}
function render(){records.innerHTML='';let el=document.getElementById('records');if(!records.length){el.innerHTML='<p class="small">No records yet.</p>';return}el.innerHTML=records.map(r=>r.type==='Shop'?`<div class="item"><b>🏪 ${r.shop}</b><br>${r.weight} kg · ${r.driver||'No driver'}<br><span class="small">${r.date}</span></div>`:`<div class="item"><b>👕 Bank ${r.bank}</b><br>Fill level: ${r.fill}/4 · ${r.driver||'No driver'}<br><span class="small">${r.date}</span></div>`).join('')}
function clearRecords(){if(confirm('Clear all saved records?')){records=[];localStorage.removeItem('emof_records');render()}}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
