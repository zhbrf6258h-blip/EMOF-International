<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>EMOF International</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:28px 20px 30px;border-radius:0 0 34px 34px}header h1{margin:0;font-size:34px}header p{margin:8px 0 0;color:#d1d5db;font-size:18px}
main{max-width:900px;margin:auto;padding:22px 16px 90px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:white;border:0;border-radius:26px;padding:24px;min-height:190px;box-shadow:0 5px 20px #00000010;text-align:left}.card .icon{font-size:42px}.card h2{color:#2878e8;font-size:25px;margin:12px 0 8px}.card p{font-size:17px;line-height:1.35;color:#2878e8;margin:0}
.hidden{display:none}.back{border:0;background:#e5e7eb;border-radius:12px;padding:12px 16px;font-size:16px;margin-bottom:16px}
.panel{background:white;border-radius:24px;padding:20px;box-shadow:0 5px 20px #00000010}.panel h2{margin-top:0;font-size:27px}
label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff}textarea{min-height:90px}
button.primary{width:100%;border:0;border-radius:13px;background:#2878e8;color:#fff;font-size:17px;font-weight:700;padding:14px;margin-top:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#f3f4f6;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}.record{border:1px solid #e5e7eb;border-radius:15px;padding:14px;margin-top:10px}.record strong{display:block}.danger{background:#fee2e2!important;color:#991b1b!important}
.small{font-size:13px;color:#6b7280}.empty{padding:25px;text-align:center;color:#6b7280}
@media(max-width:620px){.grid{grid-template-columns:1fr 1fr}.card{min-height:175px;padding:20px}.card h2{font-size:22px}.row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<header><h1>EMOF International</h1><p>Clothing Collection Management</p></header>
<main>
<section id="home">
<div class="grid">
<button class="card" onclick="show('shops')"><div class="icon">🏪</div><h2>Shop Collections</h2><p>Record collections and weights</p></button>
<button class="card" onclick="show('banks')"><div class="icon">👕</div><h2>Clothing Banks</h2><p>Check in and record fill level</p></button>
<button class="card" onclick="show('reports')"><div class="icon">📊</div><h2>Reports</h2><p>View saved collection records</p></button>
<button class="card" onclick="show('driver')"><div class="icon">🚚</div><h2>Driver Collection</h2><p>Collection management</p></button>
</div>
</section>

<section id="driver" class="hidden">
<button class="back" onclick="show('home')">← Back</button><div class="panel">
<h2>🚚 Driver Collection</h2>
<label>Collection type</label><select id="driverType"><option>Clothing Bank</option><option>Shop</option></select>
<label>Location / shop name</label><input id="driverLocation" placeholder="Enter location">
<label>Fill level</label><select id="driverFill"><option>Fill 1</option><option>Fill 2</option><option>Fill 3</option><option>Fill 4</option></select>
<div class="row"><div><label>Clothing weight (kg)</label><input id="driverWeight" type="number" min="0" step="0.1"></div><div><label>Number of bags</label><input id="driverBags" type="number" min="0"></div></div>
<label>Notes</label><textarea id="driverNotes" placeholder="Optional notes"></textarea>
<button class="primary" onclick="saveDriver()">Save collection</button>
</div></section>

<section id="shops" class="hidden">
<button class="back" onclick="show('home')">← Back</button><div class="panel">
<h2>🏪 Shop Collection</h2>
<label>Shop name</label><input id="shopName" placeholder="Enter shop name">
<label>Collection date</label><input id="shopDate" type="date">
<div class="row"><div><label>Weight (kg)</label><input id="shopWeight" type="number" min="0" step="0.1"></div><div><label>Bags</label><input id="shopBags" type="number" min="0"></div></div>
<label>Notes</label><textarea id="shopNotes" placeholder="Optional notes"></textarea>
<button class="primary" onclick="saveShop()">Save shop collection</button>
</div></section>

<section id="banks" class="hidden">
<button class="back" onclick="show('home')">← Back</button><div class="panel">
<h2>👕 Clothing Bank</h2>
<label>Bank number / location</label><input id="bankLocation" placeholder="e.g. Bank 014 - Bexley">
<label>Fill level</label><select id="bankFill"><option>Fill 1</option><option>Fill 2</option><option>Fill 3</option><option>Fill 4</option></select>
<label>Weight collected (kg)</label><input id="bankWeight" type="number" min="0" step="0.1">
<label>Notes</label><textarea id="bankNotes" placeholder="Optional notes"></textarea>
<button class="primary" onclick="saveBank()">Save bank collection</button>
</div></section>

<section id="reports" class="hidden">
<button class="back" onclick="show('home')">← Back</button><div class="panel">
<h2>📊 Reports</h2><div class="stats"><div class="stat"><b id="totalRecords">0</b>Records</div><div class="stat"><b id="totalWeight">0</b>kg</div><div class="stat"><b id="totalBags">0</b>Bags</div></div>
<div id="records"></div><button class="primary danger" onclick="clearRecords()">Delete all saved records</button>
</div></section>
</main>
<script>
const KEY='emof_records_v2';
function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(r){const a=data();a.unshift(r);localStorage.setItem(KEY,JSON.stringify(a));alert('Saved successfully');show('reports')}
function today(){return new Date().toISOString().slice(0,10)}
document.getElementById('shopDate').value=today();

function show(id){
 document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 if(id==='reports') render();
 window.scrollTo(0,0);
}
function saveDriver(){
 const location=document.getElementById('driverLocation').value.trim(); if(!location){alert('Please enter a location');return}
 save({type:'Driver',category:document.getElementById('driverType').value,location,fill:document.getElementById('driverFill').value,weight:+document.getElementById('driverWeight').value||0,bags:+document.getElementById('driverBags').value||0,notes:document.getElementById('driverNotes').value,date:today()});
}
function saveShop(){
 const location=document.getElementById('shopName').value.trim(); if(!location){alert('Please enter the shop name');return}
 save({type:'Shop',category:'Shop',location,date:document.getElementById('shopDate').value||today(),weight:+document.getElementById('shopWeight').value||0,bags:+document.getElementById('shopBags').value||0,notes:document.getElementById('shopNotes').value});
}
function saveBank(){
 const location=document.getElementById('bankLocation').value.trim(); if(!location){alert('Please enter the bank number/location');return}
 save({type:'Bank',category:'Clothing Bank',location,fill:document.getElementById('bankFill').value,weight:+document.getElementById('bankWeight').value||0,bags:0,notes:document.getElementById('bankNotes').value,date:today()});
}
function render(){
 const a=data(); document.getElementById('totalRecords').textContent=a.length;
 document.getElementById('totalWeight').textContent=a.reduce((s,r)=>s+(+r.weight||0),0).toFixed(1);
 document.getElementById('totalBags').textContent=a.reduce((s,r)=>s+(+r.bags||0),0);
 const box=document.getElementById('records');
 if(!a.length){box.innerHTML='<div class="empty">No collections saved yet.</div>';return}
 box.innerHTML=a.map((r,i)=>`<div class="record"><strong>${esc(r.location)} — ${esc(r.type)}</strong><span class="small">${esc(r.date||'')} ${r.fill?'• '+esc(r.fill):''}</span><div>${r.weight||0} kg ${r.bags?'• '+r.bags+' bags':''}</div>${r.notes?'<div class="small">'+esc(r.notes)+'</div>':''}</div>`).join('');
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function clearRecords(){if(confirm('Delete all saved collection records?')){localStorage.removeItem(KEY);render()}}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
